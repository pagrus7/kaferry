# Opt-in storage for the authentication fixture; certificates stay temporary.
services:
  storage:
    image: ${KAFERRY_AUTH_IMAGE}
    profiles: [storage]
    user: "0:0"
    network_mode: none
    entrypoint: [/bin/sh]
    environment:
      KAFERRY_FIXTURE_PROJECT: ${COMPOSE_PROJECT_NAME}
      KAFERRY_STORAGE_LAYOUT: auth
      KAFERRY_BROKER_RUN_ID: ${KAFERRY_BROKER_RUN_ID:?fixture run ID is required}
    volumes:
      - broker-data:/storage
  kafka-secure-1:
    user: "1000:1000"
    environment:
      KAFKA_LOG_DIRS: /tmp/kaferry-logs/kaferry-auth/${COMPOSE_PROJECT_NAME}/${KAFERRY_BROKER_RUN_ID}/kafka-secure-1
      KAFKA_METADATA_LOG_DIR: /tmp/kaferry-logs/kaferry-auth/${COMPOSE_PROJECT_NAME}/${KAFERRY_BROKER_RUN_ID}/kafka-secure-1
    volumes:
      - broker-data:/tmp/kaferry-logs
  kafka-secure-2:
    user: "1000:1000"
    environment:
      KAFKA_LOG_DIRS: /tmp/kaferry-logs/kaferry-auth/${COMPOSE_PROJECT_NAME}/${KAFERRY_BROKER_RUN_ID}/kafka-secure-2
      KAFKA_METADATA_LOG_DIR: /tmp/kaferry-logs/kaferry-auth/${COMPOSE_PROJECT_NAME}/${KAFERRY_BROKER_RUN_ID}/kafka-secure-2
    volumes:
      - broker-data:/tmp/kaferry-logs
  kafka-secure-3:
    user: "1000:1000"
    environment:
      KAFKA_LOG_DIRS: /tmp/kaferry-logs/kaferry-auth/${COMPOSE_PROJECT_NAME}/${KAFERRY_BROKER_RUN_ID}/kafka-secure-3
      KAFKA_METADATA_LOG_DIR: /tmp/kaferry-logs/kaferry-auth/${COMPOSE_PROJECT_NAME}/${KAFERRY_BROKER_RUN_ID}/kafka-secure-3
    volumes:
      - broker-data:/tmp/kaferry-logs

volumes:
  broker-data:
    name: ${KAFERRY_BROKER_VOLUME:?external broker volume is required}
    external: true
