    profiles: [storage]
    user: "0:0"
    network_mode: none
    entrypoint: [/bin/sh]
    environment:
      KAFERRY_FIXTURE_PROJECT: ${COMPOSE_PROJECT_NAME}
      KAFERRY_REPLICATED_RUN_ID: ${KAFERRY_REPLICATED_RUN_ID:-}
    volumes:
      - data:/storage
  source-1:
    <<: *broker
