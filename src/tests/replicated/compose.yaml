    profiles: [replicated]
    environment:
      KAFERRY_REPLICATED_RUN_ID: ${KAFERRY_REPLICATED_RUN_ID:-}
    ports:
      - "127.0.0.1:48074:8474"
      - "127.0.0.1:46092:46092"
      - "127.0.0.1:46093:46093"
      - "127.0.0.1:46094:46094"
      - "127.0.0.1:46192:46192"
