x-broker: &broker
  image: ${KAFERRY_REPLICATED_IMAGE:-apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f}
  profiles: [replicated]
  user: "1000:1000"
  volumes:
    - data:/storage
  healthcheck:
    test: [CMD, /bin/bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9092"]
    start_period: 30s
    start_interval: 1s
    interval: 5s
    timeout: 5s
    retries: 18

x-environment: &environment
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_HEAP_OPTS: -Xms128m -Xmx512m
  KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 4
  KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 4
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,ADMIN://:9094,WORKER1://:9095,WORKER2://:9096,WORKER3://:9097
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,ADMIN:PLAINTEXT,WORKER1:PLAINTEXT,WORKER2:PLAINTEXT,WORKER3:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

x-source: &source
  <<: *environment
  CLUSTER_ID: rUeZ6q3ORyS3JLd4Kc2Q9A
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@toxiproxy:28092,2@toxiproxy:28093,3@toxiproxy:28094

