version: "2"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - errorlint
    - gocognit
    - nestif
    - dupl
    - funlen
    - revive
    - unparam
    - unused
  settings:
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 4
    funlen:
      lines: 60
      statements: 40
      ignore-comments: true
    dupl:
      threshold: 100
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: early-return
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: unexported-return
        - name: var-declaration
        - name: var-naming
  exclusions:
    rules:
      - path: '_test\.go$'
        linters:
          - funlen
          - dupl
      - path: 'src/tests/.*_test\.go$'
        linters:
          - gocognit
          - nestif
          - unparam
      # Grandfathered harness complexity: remove an entry when its file is next changed.
      - path: '^src/tests/system/qualification\.go$' # waitOneOffGroupPermissions
        linters:
          - funlen
      - path: '^src/tests/system/qualification\.go$' # RunSaslTLSRestrictedACLInspectionAndUnnamedCopy
        linters:
          - funlen
      - path: '^src/tests/system/soak\.go$' # RunStreamingSoakFidelityCommitLagMemoryAndShutdown
        linters:
          - funlen
      - path: '^src/tests/system/load_report\.go$' # newLoadReport
        linters:
          - gocognit
      - path: '^src/tests/system/qualification\.go$' # waitOneOffGroupPermissions
        linters:
          - gocognit
      - path: '^src/tests/system/replicated_exposure\.go$' # watchReplicatedSamples
        linters:
          - gocognit
      - path: '^src/tests/system/soak\.go$' # RunStreamingSoakFidelityCommitLagMemoryAndShutdown
        linters:
          - gocognit
      - path: '^src/tests/system/soak_topology\.go$' # soakTopic
        linters:
          - gocognit
      - path: '^src/tests/system/soak_topology\.go$' # fullyReplicatedTopic
        linters:
          - gocognit
      - path: '^src/tests/system/worker_helpers\.go$' # waitMembers
        linters:
          - gocognit
      - path: '^src/tests/system/load_report\.go$' # newLoadReport
        linters:
          - nestif
      - path: '^src/tests/system/qualification\.go$' # waitOneOffGroupPermissions
        linters:
          - nestif
      - path: '^src/tests/system/soak\.go$' # RunStreamingSoakFidelityCommitLagMemoryAndShutdown
        linters:
          - nestif

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
