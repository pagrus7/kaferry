name: container-test
description: Smoke test native OCI images, publishing and shutdown recovery
inputs:
  arch:
    description: Native runner architecture
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: sudo apt-get update && sudo apt-get install --yes skopeo
    - name: Load the native platform without rebuilding
      env:
        ARCH: ${{ inputs.arch }}
      shell: bash
      run: |
        skopeo copy --override-arch "$ARCH" oci-archive:.cache/kaferry.oci.tar docker-daemon:kaferry:ci
        skopeo copy --override-arch "$ARCH" oci-archive:.cache/kaferry-demo.oci.tar docker-daemon:kaferry-demo:ci
    - name: Verify packaged bytes and file-copy fidelity
      env:
        ARCH: ${{ inputs.arch }}
      shell: bash
      run: python3 -m tools.release.container_smoke kaferry:ci .cache/container-context "$ARCH"
    - name: Verify the disposable Kafka demo and failure handling
      env:
        ARCH: ${{ inputs.arch }}
      shell: bash
      run: python3 -m tools.release.container_smoke kaferry-demo:ci .cache/container-context "$ARCH" --demo
    - name: Verify immutable OCI publishing against a disposable registry
      if: inputs.arch == 'amd64'
      shell: bash
      run: |
        printf '[[registry]]\nlocation="localhost:5000"\ninsecure=true\n' | sudo tee /etc/containers/registries.conf > /dev/null
        docker run --detach --name kaferry-image-registry --publish 127.0.0.1:5000:5000 \
          registry:3@sha256:01cd312e67026f06f5d89c3e133a4a9adc7cb9eeb9b1194e0b2954dfd770efd2
        curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 3 http://localhost:5000/v2/
        first=$(python3 -m tools.release.container_publish .cache/kaferry.oci.tar localhost:5000/kaferry:test)
        second=$(python3 -m tools.release.container_publish .cache/kaferry.oci.tar localhost:5000/kaferry:test)
        test "$first" = "$second"
        latest=$(python3 -m tools.release.container_publish .cache/kaferry.oci.tar localhost:5000/kaferry:latest)
        test "$latest" = "$first"
        printf '%s\n' "$first" | grep -Eq '^sha256:[a-f0-9]{64}$'
    - shell: bash
      run: make broker
    - name: Verify SIGTERM checkpointing and container resume
      env:
        KAFERRY_TEST_IMAGE: kaferry:ci
        KAFKA_TEST_BROKERS: 127.0.0.1:19092
      shell: bash
      run: |
        python3 -m tools.ci.ci container-resume go test -count=1 -json -timeout=3m -tags=integration,container -run '^TestContainerShutdownAndResume$' ./src/tests/system
        python3 -m tools.ci.ci verify-tests container-resume TestContainerShutdownAndResume
    - if: always()
      shell: bash
      run: |
        make broker-down
        docker rm --force kaferry-image-registry 2>/dev/null || true
