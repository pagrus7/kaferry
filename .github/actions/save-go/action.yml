name: Save completed Go compilation results
description: Save successful non-PR compilation work after the job's checks.
inputs:
  key:
    description: Primary cache key from the shared Go setup.
    required: true
  cache-hit:
    description: Whether the primary cache entry already exists.
    default: 'false'
runs:
  using: composite
  steps:
    - if: github.event_name != 'pull_request' && inputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ inputs.key }}
