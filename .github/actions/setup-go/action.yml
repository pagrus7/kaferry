name: Set up Go with a restored compilation cache
description: Restore Go modules and compilation results; callers save successful non-PR work.
inputs:
  cache-name:
    description: Stable job and suite name for independently populated compilation caches.
    required: true
outputs:
  cache-key:
    description: Key for this commit's compilation results.
    value: ${{ steps.cache.outputs.cache-primary-key }}
  cache-hit:
    description: Whether this commit already has an exact cache entry.
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.27.3'
        cache: false
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-ubuntu24-${{ runner.arch }}-1.27.3-${{ inputs.cache-name }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          go-ubuntu24-${{ runner.arch }}-1.27.3-${{ inputs.cache-name }}-${{ hashFiles('go.sum') }}-
