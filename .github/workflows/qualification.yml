name: qualification
on:
  schedule:
    - cron: '17 9 * * 0,2-6'
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      soak_duration:
        description: 'Soak duration (Go duration, minimum 1m)'
        default: '30m'
        required: true
permissions:
  contents: read
  actions: read
env:
  CGO_ENABLED: "0"
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run: ${{ steps.plan.outputs.run }}
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      - name: Choose nightly checks or the weekly full run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          suites='["fault","qualification","fuzz","benchmark"]'
          run=true
          if [ "$EVENT" = workflow_dispatch ] || [ "$SCHEDULE" = "17 9 * * 1" ]; then
            suites='["load","soak","fault","qualification","fuzz","benchmark"]'
          else
            previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow qualification.yml --branch main --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
            if [ "$previous" = "$GITHUB_SHA" ]; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
          echo "Extended tests: run=$run, suites=$suites. Nightly checks skip an unchanged main; weekly checks always run." >> "$GITHUB_STEP_SUMMARY"
  qualification:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/suites.yml
    with:
      suites: ${{ needs.plan.outputs.suites }}
      soak_duration: ${{ inputs.soak_duration || '30m' }}
      history: true
