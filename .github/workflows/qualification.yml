name: qualification
on:
  schedule:
    - cron: '17 9 * * 0,2-6'
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      soak_duration:
        description: 'Soak duration (Go duration, minimum 1m)'
        default: '30m'
        required: true
permissions:
  contents: read
  actions: read
env:
  CGO_ENABLED: "0"
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run: ${{ steps.plan.outputs.run }}
      suites: ${{ steps.plan.outputs.suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Choose suites or reuse recent executions
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          WEEKLY: ${{ github.event.schedule == '17 9 * * 1' }}
        run: python3 scripts/scheduled.py qualification
  qualification:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/suites.yml
    with:
      suites: ${{ needs.plan.outputs.suites }}
      soak_duration: ${{ inputs.soak_duration || '30m' }}
      history: true
