name: PR reviews
on:
  workflow_run:
    workflows: [checks]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR to review'
        type: string
        required: true
permissions:
  contents: read
  pull-requests: read
jobs:
  targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      has_reviews: ${{ steps.targets.outputs.has_reviews }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pr_review.py targets
  review:
    needs: targets
    if: needs.targets.outputs.has_reviews == 'true'
    name: ${{ matrix.role }} review (PR ${{ matrix.number }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pr-review-${{ matrix.number }}-${{ matrix.role }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Start PR check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ROLE: ${{ matrix.role }}
          HEAD: ${{ matrix.head }}
        run: |
          id=$(python3 scripts/pr_review.py check-start --role "$ROLE" --head "$HEAD")
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned Claude Code
        working-directory: ${{ runner.temp }}
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-cli" @anthropic-ai/claude-code@2.1.296
          echo "$RUNNER_TEMP/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Review read-only snapshots
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ROLE: ${{ matrix.role }}
          NUMBER: ${{ matrix.number }}
          BASE: ${{ matrix.base }}
          HEAD: ${{ matrix.head }}
        run: |
          python3 scripts/pr_review.py run --role "$ROLE" --number "$NUMBER" \
            --base "$BASE" --head "$HEAD" --output "$RUNNER_TEMP/review-result"
      - name: Publish PR check
        if: always() && steps.check.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ steps.check.outputs.id }}
          REVIEW_JOB_STATUS: ${{ job.status }}
        run: |
          python3 scripts/pr_review.py check-finish --id "$CHECK_ID" --output "$RUNNER_TEMP/review-result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: review-${{ matrix.number }}-${{ matrix.head }}-${{ matrix.role }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-result/
          retention-days: 30
