name: parallel lab rehearsal
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/qualification/qualify.py'
      - 'tools/qualification/test_qualify.py'
      - 'src/tests/system/recovery*'
      - 'src/tests/system/soak.go'
      - 'src/tests/compatibility/soak_test.go'
      - 'src/tests/system/fault_test.go'
      - '.github/workflows/parallel-lab.yml'
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          cache-name: pr-brokers
      - name: Build candidate
        run: make build
      - name: Install independent recovery checker
        run: python3 -m tools.qualification.qualify setup
      - name: Run independent workloads together
        run: python3 -m tools.qualification.qualify parallel --duration 1m --companion-duration 1m --output build-results/parallel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: parallel-lab-evidence
          path: build-results/parallel
          retention-days: 7
