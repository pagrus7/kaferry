name: parallel lab rehearsal
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/qualification/qualify.py'
      - 'tools/qualification/test_qualify.py'
      - 'tools/qualification/test_broker_storage.py'
      - 'src/tests/compose.yaml'
      - 'src/tests/broker-storage.compose.yaml'
      - 'src/tests/replicated/storage.sh'
      - 'src/tests/system/recovery*'
      - 'src/tests/system/soak.go'
      - 'src/tests/compatibility/soak_test.go'
      - 'src/tests/system/fault_test.go'
      - '.github/workflows/parallel-lab.yml'
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          cache-name: pr-brokers
      - name: Build candidate
        run: make build
      - name: Install independent recovery checker
        run: python3 -m tools.qualification.qualify setup
      - name: Run independent workloads together
        run: python3 -m tools.qualification.qualify parallel --duration 1m --companion-duration 1m --output build-results/parallel
      - name: Rehearse owned broker directories on an existing local volume
        run: |
          owner=$(python3 -c 'import uuid; print(uuid.uuid4().hex)')
          volume="kaferry-lab-ci-$owner"
          image=$(python3 -c 'import json; print(next(iter(json.load(open("src/tests/qualification/matrix.json")).values())))')
          if docker volume inspect "$volume" >/dev/null 2>&1; then
            echo 'Refusing an existing CI volume' >&2
            exit 1
          fi
          docker volume create --label kaferry.lab.storage=true --label "kaferry.lab.ci.owner=$owner" "$volume"
          cleanup() {
            local status=$?
            if ! docker volume inspect --format '{{json .Labels}}' "$volume" |
              python3 -c 'import json,sys; labels=json.load(sys.stdin); assert labels.get("kaferry.lab.storage") == "true" and labels.get("kaferry.lab.ci.owner") == sys.argv[1]' "$owner"; then
              echo 'Preserving CI volume: ownership could not be verified' >&2
              return 1
            fi
            if ! docker run --rm --network none --user 0:0 --mount "type=volume,src=$volume,dst=/storage,readonly" --entrypoint /bin/sh "$image" -ec 'test "$(ls -A /storage)" = ci-sentinel; test "$(cat /storage/ci-sentinel)" = unrelated-data'; then
              echo 'Preserving CI volume: expected only the unchanged sentinel after cleanup' >&2
              return 1
            fi
            docker volume rm "$volume"
            return "$status"
          }
          trap cleanup EXIT
          docker run --rm --network none --user 0:0 --mount "type=volume,src=$volume,dst=/storage" --entrypoint /bin/sh "$image" -ec 'printf "%s\n" unrelated-data > /storage/ci-sentinel'
          python3 -m tools.qualification.qualify parallel --duration 1m --companion-duration 1m --broker-volume "$volume" --output build-results/parallel-external
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: parallel-lab-evidence
          path: |
            build-results/parallel
            build-results/parallel-external
          retention-days: 7
