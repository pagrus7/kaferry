name: extended suite
on:
  workflow_call:
    inputs:
      suites:
        type: string
        required: true
      fault_tier:
        description: Fault fixture timeout tier (full or pr)
        type: string
        default: full
      artifact:
        description: 'Release archive artifact; empty builds source'
        type: string
        default: ''
      soak_duration:
        type: string
        default: '30m'
      history:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
env:
  CGO_ENABLED: "0"
jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.suite == 'soak' && 60 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suites) }}
    env:
      KAFKA_TEST_BROKERS: 127.0.0.1:39092
      KAFKA_TEST_DEST_BROKERS: 127.0.0.1:40092
      KAFKA_FAULT_CONTAINER: kaferry-compat-kafka-1
      KAFERRY_SOAK_DURATION: ${{ inputs.soak_duration }}
      KAFERRY_SOAK_DEST_STALL_CONTAINER: kaferry-compat-kafka-dr-1
      SUITE: ${{ matrix.suite }}
      KAFERRY_FAULT_TIER: ${{ inputs.fault_tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          cache-name: pr-brokers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
          path: release/
      - name: Use the packaged binary
        if: inputs.artifact != ''
        run: |
          set -- release/kaferry-*.tar.gz
          test "$#" = 1
          mkdir -p .cache/release-test
          tar -xzf "$1" -C .cache/release-test
          echo "KAFERRY_TEST_BINARY=$PWD/.cache/release-test/kaferry" >> "$GITHUB_ENV"
          echo "KAFERRY_EXPECT_BINARY_SHA256=$(sha256sum .cache/release-test/kaferry | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          sha256sum "$1" >> "$GITHUB_STEP_SUMMARY"
      - name: Build source binary
        if: inputs.artifact == '' && matrix.suite != 'fuzz' && matrix.suite != 'benchmark'
        run: |
          python3 -m tools.ci.ci build make build
          echo "KAFERRY_TEST_BINARY=$PWD/bin/kaferry" >> "$GITHUB_ENV"
      - name: Start plain Kafka fixtures
        if: contains(fromJSON('["integration","load","soak","fault"]'), matrix.suite)
        run: python3 -m tools.ci.ci broker make broker
      - name: Install independent fault observer
        if: matrix.suite == 'fault'
        run: python3 -m tools.qualification.qualify setup
      - name: Run suite
        run: python3 -m tools.ci.suites ci "$SUITE"
      - name: Previous successful measurements
        if: always() && inputs.history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.ci.history "$SUITE"
      - name: Reject source rebuilds in archive tests
        if: always() && inputs.artifact != ''
        run: test ! -e bin/kaferry
      - if: always() && contains(fromJSON('["integration","load","soak","fault"]'), matrix.suite)
        run: |
          mkdir -p build-results
          docker compose -f src/tests/compose.yaml -p kaferry-compat --profile cross-cluster logs --no-color > build-results/brokers.log
          make broker-down
      - if: always()
        run: python3 -m tools.ci.ci summary
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ matrix.suite }}
          path: build-results/
          retention-days: 30
