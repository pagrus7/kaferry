name: replicated fixture
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      weekly:
        description: Run only the three weekly regression cases
        type: boolean
        default: false
  pull_request:
    paths:
      - 'src/tests/replicated/**'
      - 'src/tests/system/faults/**'
      - 'src/tests/system/replicated_*.go'
      - 'src/tests/system/fault_oracle.go'
      - 'src/tests/qualification/matrix.json'
      - 'src/tests/system/soak*'
      - 'src/tests/system/endurance*'
      - 'src/tests/system/fixtures.go'
      - 'src/tests/qualification/fault-timeouts-ms.json'
      - 'tools/qualification/qualify.py'
      - 'tools/qualification/replicated_evidence.py'
      - 'tools/qualification/broker_probe.py'
      - 'tools/qualification/test_qualify.py'
      - 'tools/qualification/network.py'
      - 'tools/qualification/test_network.py'
      - 'tools/qualification/fault_oracle.py'
      - 'tools/qualification/fault_results.py'
      - 'tools/qualification/ownership_audit.py'
      - 'tools/qualification/test_fault_oracle.py'
      - 'tools/qualification/test_ownership_audit.py'
      - 'tools/qualification/ownership_cases.py'
      - 'tools/qualification/test_ownership_cases.py'
      - 'tools/qualification/replicated_results.py'
      - 'tools/qualification/test_replicated_results.py'
      - 'tools/ci/replicated_suites.py'
      - '.github/workflows/replicated-lab.yml'
permissions:
  contents: read
concurrency:
  group: replicated-fixture-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      binary_sha256: ${{ steps.candidate.outputs.sha256 }}
      fault_matrix: ${{ steps.cases.outputs.fault_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Select replicated fault cases
        id: cases
        env:
          WEEKLY: ${{ github.event_name == 'schedule' || inputs.weekly == true }}
        run: python3 -m tools.ci.replicated_suites >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/replicated-setup
        id: candidate
        with:
          smoke: ${{ github.event_name != 'schedule' && inputs.weekly != true }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replicated-fixture-candidate
          path: bin/kaferry
          retention-days: 14
      - uses: ./.github/actions/replicated-run
        if: ${{ github.event_name != 'schedule' && inputs.weekly != true }}
        with:
          suite: replicated
          output: build-results/replicated
          artifact: replicated-fixture-evidence
  zombie:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-go
        with:
          cache-name: pr-brokers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: replicated-fixture-candidate
          path: bin
      - name: Verify selected candidate and install the independent checker
        env:
          EXPECTED_BINARY_SHA256: ${{ needs.smoke.outputs.binary_sha256 }}
        run: |
          test "${#EXPECTED_BINARY_SHA256}" = 64
          printf '%s  bin/kaferry\n' "$EXPECTED_BINARY_SHA256" | sha256sum --check --strict
          chmod +x bin/kaferry
          bin/kaferry --version
          python3 -m tools.qualification.qualify setup
      - uses: ./.github/actions/replicated-run
        with:
          case: ownership/zombie-worker
          output: build-results/replicated-zombie
          artifact: replicated-zombie-evidence
  faults:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.smoke.outputs.fault_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-go
        with:
          cache-name: pr-brokers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: replicated-fixture-candidate
          path: bin
      - name: Verify selected candidate and install the independent checker
        env:
          EXPECTED_BINARY_SHA256: ${{ needs.smoke.outputs.binary_sha256 }}
        run: |
          test "${#EXPECTED_BINARY_SHA256}" = 64
          printf '%s  bin/kaferry\n' "$EXPECTED_BINARY_SHA256" | sha256sum --check --strict
          chmod +x bin/kaferry
          bin/kaferry --version
          python3 -m tools.qualification.qualify setup
      - uses: ./.github/actions/replicated-run
        with:
          case: ${{ matrix.case }}
          output: build-results/replicated-fault
          artifact: replicated-${{ matrix.name }}-evidence
  endurance:
    if: ${{ github.event_name != 'schedule' && inputs.weekly != true }}
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-go
        with:
          cache-name: pr-brokers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: replicated-fixture-candidate
          path: bin
      - name: Verify selected candidate and install the independent checker
        env:
          EXPECTED_BINARY_SHA256: ${{ needs.smoke.outputs.binary_sha256 }}
        run: |
          test "${#EXPECTED_BINARY_SHA256}" = 64
          printf '%s  bin/kaferry\n' "$EXPECTED_BINARY_SHA256" | sha256sum --check --strict
          chmod +x bin/kaferry
          bin/kaferry --version
          python3 -m tools.qualification.qualify setup
      - uses: ./.github/actions/replicated-run
        with:
          suite: endurance
          output: build-results/replicated-endurance
          artifact: replicated-endurance-evidence
