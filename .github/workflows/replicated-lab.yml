name: replicated fixture
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/tests/replicated/**'
      - 'src/tests/system/faults/**'
      - 'src/tests/system/replicated_*.go'
      - 'src/tests/system/fault_oracle.go'
      - 'src/tests/qualification/matrix.json'
      - 'src/tests/system/soak*'
      - 'src/tests/system/endurance*'
      - 'src/tests/system/fixtures.go'
      - 'src/tests/qualification/fault-timeouts-ms.json'
      - 'tools/qualification/qualify.py'
      - 'tools/qualification/broker_probe.py'
      - 'tools/qualification/broker_lifecycle.py'
      - 'tools/qualification/broker_readiness.py'
      - 'tools/qualification/test_qualify.py'
      - 'tools/qualification/storage_census_images_test.py'
      - 'tools/qualification/network.py'
      - 'tools/qualification/test_network.py'
      - 'tools/qualification/test_endurance_topology.py'
      - 'tools/qualification/fault_oracle.py'
      - 'tools/qualification/fault_results.py'
      - 'tools/qualification/ownership_audit.py'
      - 'tools/qualification/test_fault_oracle.py'
      - 'tools/qualification/test_ownership_audit.py'
      - 'tools/qualification/replicated_results.py'
      - 'tools/qualification/test_replicated_results.py'
      - 'tools/ci/suites.py'
      - '.github/workflows/replicated-lab.yml'
permissions:
  contents: read
concurrency:
  group: replicated-fixture-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      binary_sha256: ${{ steps.candidate.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-go
        with:
          cache-name: pr-brokers
      - name: Validate the rendered fixture
        env:
          KAFERRY_REPLICATED_RUN_ID: '00000000000000000000000000000000'
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          from tools.qualification import network
          # Given the pinned broker and proxy images, render the replicated fixture.
          image = list(json.loads(Path('src/tests/qualification/matrix.json').read_text()).values())[-1]
          fixture = json.loads(subprocess.check_output(['docker', 'compose', '-f', 'src/tests/replicated/compose.yaml', '-p', 'kaferry-replicated', '--profile', 'replicated', 'config', '--format', 'json']))
          services = fixture['services']
          # When rendered, then all six brokers retain RF=3, min ISR=2 and capped heaps.
          brokers = {f'{side}-{node}' for side in ('source', 'destination') for node in range(1, 4)}
          assert set(services) == brokers | {'toxiproxy'}
          assert len({services[name]['environment']['KAFKA_LOG_DIRS'] for name in brokers}) == 6
          assert services['toxiproxy']['image'] == network.IMAGE
          assert {port['published'] for port in services['toxiproxy']['ports']} == {str(port) for port in (*network.client_ports(), 48074)}
          for name in brokers:
              service = services[name]
              assert service['image'] == image
              assert service['user'] == '1000:1000'
              assert not service.get('ports')
              env = service['environment']
              assert env['KAFKA_DEFAULT_REPLICATION_FACTOR'] == '3'
              assert env['KAFKA_MIN_INSYNC_REPLICAS'] == '2'
              assert env['KAFKA_HEAP_OPTS'] == '-Xms128m -Xmx512m'
              side, node = name.split('-')
              expected = [f'INTERNAL://toxiproxy:{network.route_port(side, int(node), "internal")}']
              expected += [f'{listener.upper()}://127.0.0.1:{network.route_port(side, int(node), listener)}' for listener in network.LISTENERS[2:]]
              assert env['KAFKA_ADVERTISED_LISTENERS'].split(',') == expected
              assert env['KAFKA_CONTROLLER_QUORUM_VOTERS'] == ','.join(f'{node}@toxiproxy:{network.route_port(side, node, "controller")}' for node in range(1, 4))
          assert services['source-1']['environment']['CLUSTER_ID'] != services['destination-1']['environment']['CLUSTER_ID']
          PY
      - name: Check cleanup diagnostics in pinned images without brokers
        run: |
          python3 - <<'PY'
          import subprocess
          from tools.qualification.storage_census_images_test import CENSUS_IMAGES
          for image in CENSUS_IMAGES:
              subprocess.run(['docker', 'pull', image], check=True)
          PY
          python3 -m unittest -v tools.qualification.storage_census_images_test
      - name: Install the independent checker and build candidate
        id: candidate
        shell: bash
        run: |
          make qualification-setup
          echo "sha256=$(sha256sum bin/kaferry | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Check endurance gates and diagnostic retention without brokers
        env:
          KAFERRY_TEST_BINARY: ${{ github.workspace }}/bin/kaferry
          KAFERRY_EXPECT_BINARY_SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: go test -race -tags=integration,load -run '^(TestLoadReport|TestReplicatedEndurance|TestOwnedBroker|TestStallTrace|TestEndurance|TestSoak)' ./src/tests/system
      - name: Copy and independently reconcile the replicated fixture
        run: python3 -m tools.qualification.qualify run replicated --binary bin/kaferry --output build-results/replicated
      - name: Verify fixture teardown
        run: |
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=kaferry-replicated)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=kaferry-replicated)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replicated-fixture-candidate
          path: bin/kaferry
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: replicated-fixture-evidence
          path: build-results/replicated
          retention-days: 14
  zombie:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-go
        with:
          cache-name: pr-brokers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: replicated-fixture-candidate
          path: bin
      - name: Verify selected candidate and install the independent checker
        env:
          EXPECTED_BINARY_SHA256: ${{ needs.smoke.outputs.binary_sha256 }}
        run: |
          test "${#EXPECTED_BINARY_SHA256}" = 64
          printf '%s  bin/kaferry\n' "$EXPECTED_BINARY_SHA256" | sha256sum --check --strict
          chmod +x bin/kaferry
          bin/kaferry --version
          python3 -m tools.qualification.qualify setup
      - name: Qualify live zombie ownership fencing
        run: python3 -m tools.qualification.qualify run fault-replicated --case ownership/zombie-worker --binary bin/kaferry --output build-results/replicated-zombie
      - name: Verify fault fixture teardown
        if: always()
        run: |
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=kaferry-replicated)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=kaferry-replicated)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: replicated-zombie-evidence
          path: build-results/replicated-zombie
          retention-days: 14
  faults:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: source-leader, case: broker/source-leader}
          - {name: destination-leader, case: broker/destination-leader}
          - {name: rolling-source, case: broker/rolling-source}
          - {name: rolling-destination, case: broker/rolling-destination}
          - {name: destination-isr-loss, case: broker/destination-isr-loss}
          - {name: network-destination-outage, case: network/destination-outage}
          - {name: network-destination-leaders-outage, case: network/destination-leaders-outage}
          - {name: network-latency, case: network/latency}
          - {name: network-bandwidth, case: network/bandwidth}
          - {name: network-slow-close, case: network/slow-close}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-go
        with:
          cache-name: pr-brokers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: replicated-fixture-candidate
          path: bin
      - name: Verify selected candidate and install the independent checker
        env:
          EXPECTED_BINARY_SHA256: ${{ needs.smoke.outputs.binary_sha256 }}
        run: |
          test "${#EXPECTED_BINARY_SHA256}" = 64
          printf '%s  bin/kaferry\n' "$EXPECTED_BINARY_SHA256" | sha256sum --check --strict
          chmod +x bin/kaferry
          bin/kaferry --version
          python3 -m tools.qualification.qualify setup
      - name: Qualify selected replicated fault
        env:
          CASE: ${{ matrix.case }}
        run: python3 -m tools.qualification.qualify run fault-replicated --case "$CASE" --binary bin/kaferry --output build-results/replicated-fault
      - name: Verify fault fixture teardown
        if: always()
        run: |
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=kaferry-replicated)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=kaferry-replicated)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: replicated-${{ matrix.name }}-evidence
          path: build-results/replicated-fault
          retention-days: 14
  endurance:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-go
        with:
          cache-name: pr-brokers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: replicated-fixture-candidate
          path: bin
      - name: Verify selected candidate and install the independent checker
        env:
          EXPECTED_BINARY_SHA256: ${{ needs.smoke.outputs.binary_sha256 }}
        run: |
          test "${#EXPECTED_BINARY_SHA256}" = 64
          printf '%s  bin/kaferry\n' "$EXPECTED_BINARY_SHA256" | sha256sum --check --strict
          chmod +x bin/kaferry
          bin/kaferry --version
          python3 -m tools.qualification.qualify setup
      - name: Rehearse the unchanged endurance workload on replicated clusters
        run: python3 -m tools.qualification.qualify run endurance --topology replicated --duration 1m --output build-results/replicated-endurance
      - name: Verify replicated endurance teardown
        run: |
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=kaferry-replicated)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=kaferry-replicated)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: replicated-endurance-evidence
          path: build-results/replicated-endurance
          retention-days: 14
