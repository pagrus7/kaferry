name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check current-behavior wording
        run: |
          wording_status=0
          git grep -nEi '(since|as of|starting (in|with)|introduced in)[[:space:]]+v[0-9]+\.[0-9]+|first[[:space:]]+observed[[:space:]]+(on|in)[[:space:]]+[0-9]{4}' -- README.md docs design cmd internal ':!design/debates' || wording_status=$?
          if [ "$wording_status" -ne 1 ]; then
            echo 'Living docs, comments and diagnostics must describe current behavior; keep release and investigation history in release notes, commits or PRs.'
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - run: test -z "$(gofmt -l cmd internal tests)"
      - run: python3 scripts/ci.py vet go vet ./...
      - run: python3 scripts/ci.py unit go test -count=1 -json -race -coverpkg=./... -coverprofile=build-results/coverage.out ./...
      - name: Coverage reports
        run: |
          python3 scripts/quality.py coverage
          go tool cover -html=build-results/coverage.out -o=build-results/coverage.html
      - run: make build
      - run: python3 -c "from pathlib import Path; assert sum(len(p.read_text()) for p in [Path('README.md'),Path('docs/file-format.md')]) < 10000"
      - name: Publish Go coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build-results/coverage.out
          disable_search: true
          flags: go
          use_oidc: true
          version: v11.3.1
          fail_ci_if_error: true
      - if: always()
        run: python3 scripts/ci.py summary
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-fast
          path: build-results/
          retention-days: 30
  kafka:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      KAFKA_TEST_BROKERS: 127.0.0.1:39092
      KAFKA_TEST_DEST_BROKERS: 127.0.0.1:40092
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - run: python3 scripts/ci.py broker make broker
      - run: python3 scripts/ci.py integration go test -count=1 -json -race -tags=integration -coverpkg=./... -coverprofile=build-results/coverage.out ./...
      - name: Coverage reports
        run: |
          python3 scripts/quality.py coverage
          go tool cover -html=build-results/coverage.out -o=build-results/coverage.html
      - name: Publish Go coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build-results/coverage.out
          disable_search: true
          flags: go
          use_oidc: true
          version: v11.3.1
          fail_ci_if_error: true
      - if: always()
        run: |
          mkdir -p build-results
          docker compose -p kaferry-compat --profile cross-cluster logs --no-color > build-results/brokers.log
          make broker-down
      - if: always()
        run: python3 scripts/ci.py summary
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-kafka
          path: build-results/
          retention-days: 30
