name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CGO_ENABLED: "0"
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  warm-broker-cache:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          cache-name: pr-brokers
      - run: make build
      - name: Compile fault fixtures
        run: go test -run '^$' -tags=integration,fault ./src/tests/system
      - name: Compile standalone fault and parallel fixtures
        env:
          CGO_ENABLED: "1"
        run: go test -run '^$' -tags=integration,fault ./src/tests/system
      - name: Compile capture and parallel streaming fixtures
        env:
          CGO_ENABLED: "1"
        run: go test -run '^$' -tags=integration,load ./src/tests/compatibility
      - name: Compile security and failover fixtures
        env:
          CGO_ENABLED: "1"
        run: go test -run '^$' -race -tags=integration,qualification ./src/tests/compatibility
  warm-container-cache:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          cache-name: container-inputs
      - name: Compile both Linux container inputs
        run: python3 -m tools.release.container_artifacts candidate .cache/container-context
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check current-behavior wording
        run: make wording
      - name: Documentation links and shell examples
        run: python3 -m tools.docs.docs
      - uses: ./.github/actions/setup-go
        with:
          cache-name: checks-fast
      - run: make fmt
      - run: python3 -m tools.ci.ci unit go test -vet=off -count=1 -json -race -coverpkg=./... -coverprofile=build-results/coverage.out ./...
        env:
          CGO_ENABLED: "1"
      - name: Coverage reports
        run: |
          go tool cover -func=build-results/coverage.out > build-results/coverage.txt
          echo "Go statement coverage: $(tail -n 1 build-results/coverage.txt | awk '{print $NF}')" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html=build-results/coverage.out -o=build-results/coverage.html
      - name: Compile broker fixtures without CGO
        env:
          CGO_ENABLED: "0"
        run: go test -run '^$' -tags=integration,load,fault,qualification,migration ./src/tests/system ./src/tests/compatibility
      - run: make build
        env:
          CGO_ENABLED: "0"
      - name: Run the documented archive tutorial and file-copy smoke
        run: make smoke
      - name: Validate release license notices
        env:
          CGO_ENABLED: "0"
        run: python3 -m tools.release.notices bin/kaferry bin/THIRD_PARTY_NOTICES.txt
      - name: Verify source installation
        run: python3 -m tools.ci.ci source-install python3 -m tools.release.install_smoke
      - name: Publish Go coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build-results/coverage.out
          disable_search: true
          flags: go
          use_oidc: true
          version: v11.3.1
          fail_ci_if_error: true
      - if: always()
        run: python3 -m tools.ci.ci summary
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-fast
          path: build-results/
          retention-days: 30
  kafka:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      KAFKA_TEST_BROKERS: 127.0.0.1:39092
      KAFKA_TEST_DEST_BROKERS: 127.0.0.1:40092
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        with:
          cache-name: checks-kafka
      - run: python3 -m tools.ci.ci broker make broker
      - run: python3 -m tools.ci.ci integration go test -count=1 -json -race -tags=integration -coverpkg=./... -coverprofile=build-results/coverage.out ./src/tests/system
        env:
          CGO_ENABLED: "1"
      - run: python3 -m tools.ci.ci verify-tests integration 'TestCLIInterruptCommitsAndResumeDoesNotRecopy' 'TestAllFileDirectionsAndResume' 'TestTopicToTopicSlice'
      - name: Check progress and archives against the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CGO_ENABLED: "1"
        run: |
          mkdir -p .cache/previous-version
          git archive "$BASE_SHA" | tar -x -C .cache/previous-version
          previous_source=.
          if [ -d .cache/previous-version/src/cmd/kaferry ]; then previous_source=src; fi
          previous_codec=".cache/previous-version/$previous_source/internal/kafka/commitmeta/codec.go"
          if [ ! -f "$previous_codec" ]; then
            previous_codec=".cache/previous-version/$previous_source/internal/commitmeta/codec.go"
          fi
          progress_format_status=0
          grep -Fq 'const prefix = "kaferry:4;"' "$previous_codec" || progress_format_status=$?
          if [ "$progress_format_status" -eq 0 ]; then
            echo 'Skipping cross-version resume: kaferry:4 progress is unsupported.'
            exit 0
          elif [ "$progress_format_status" -ne 1 ]; then
            exit "$progress_format_status"
          fi
          previous_binary="$PWD/build-results/kaferry-previous"
          (cd .cache/previous-version && CGO_ENABLED=0 go build -trimpath -o "$previous_binary" "./$previous_source/cmd/kaferry")
          CGO_ENABLED=0 make build
          export KAFERRY_PREVIOUS_BINARY="$previous_binary"
          if [ ! -f ".cache/previous-version/$previous_source/internal/sql/options.go" ]; then
            export KAFERRY_LEGACY_SQL_BINARY="$previous_binary"
          fi
          archive_syntax_status=0
          grep -Fq 'p.take("ARCHIVE")' ".cache/previous-version/$previous_source/internal/sql/parser.go" || archive_syntax_status=$?
          if [ "$archive_syntax_status" -eq 1 ]; then
            export KAFERRY_FILE_SQL_BINARIES="$previous_binary"
          elif [ "$archive_syntax_status" -ne 0 ]; then
            exit "$archive_syntax_status"
          fi
          export KAFERRY_TEST_BINARY="$PWD/bin/kaferry"
          python3 -m tools.ci.ci migration go test -count=1 -race -tags=integration,migration -run TestPreviousBinary -v ./src/tests/system
      - name: Coverage reports
        run: |
          go tool cover -func=build-results/coverage.out > build-results/coverage.txt
          echo "Go statement coverage: $(tail -n 1 build-results/coverage.txt | awk '{print $NF}')" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html=build-results/coverage.out -o=build-results/coverage.html
      - name: Publish Go coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build-results/coverage.out
          disable_search: true
          flags: go
          use_oidc: true
          version: v11.3.1
          fail_ci_if_error: true
      - if: always()
        run: |
          mkdir -p build-results
          docker compose -f src/tests/compose.yaml -p kaferry-compat --profile cross-cluster logs --no-color > build-results/brokers.log
          make broker-down
      - if: always()
        run: python3 -m tools.ci.ci summary
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-kafka
          path: build-results/
          retention-days: 30
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      KAFKA_TEST_BROKERS: 127.0.0.1:39092
      KAFKA_TEST_DEST_BROKERS: 127.0.0.1:40092
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          cache-name: checks-load
      - run: python3 -m tools.ci.ci broker make broker
      - name: Capture bounded load measurements
        run: python3 -m tools.ci.ci load make load
      - name: Check the fresh-broker quick start
        env:
          CGO_ENABLED: "1"
          KAFERRY_QUICKSTART: "1"
          KAFERRY_TEST_BINARY: ${{ github.workspace }}/bin/kaferry
        run: python3 -m tools.ci.ci quickstart go test -count=1 -json -race -tags=integration -coverpkg=./... -coverprofile=build-results/quickstart-coverage.out -run '^TestKafkaQuickStart$' ./src/tests/system
      - run: python3 -m tools.ci.ci verify-tests quickstart 'TestKafkaQuickStart'
      - name: Publish quick-start Go coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build-results/quickstart-coverage.out
          disable_search: true
          flags: go
          use_oidc: true
          version: v11.3.1
          fail_ci_if_error: true
      - if: always()
        run: |
          mkdir -p build-results
          docker compose -f src/tests/compose.yaml -p kaferry-compat --profile cross-cluster logs --no-color > build-results/brokers.log
          make broker-down
      - if: always()
        run: python3 -m tools.ci.ci summary
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-load
          path: build-results/
          retention-days: 30
