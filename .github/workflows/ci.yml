name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check current-behavior wording
        run: |
          wording_status=0
          git grep -nEi '(since|as of|through|until|prior to|starting (in|with)|introduced in)[[:space:]]+v[0-9]+\.[0-9]+|first[[:space:]]+observed[[:space:]]+(on|in)[[:space:]]+[0-9]{4}' -- README.md docs design cmd internal ':!design/debates' || wording_status=$?
          if [ "$wording_status" -ne 1 ]; then
            echo 'Living docs, comments and diagnostics must describe current behavior; keep release and investigation history in release notes, commits or PRs.'
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - run: test -z "$(gofmt -l cmd internal tests)"
      - run: python3 scripts/ci.py vet go vet ./...
      - run: python3 scripts/ci.py unit go test -count=1 -json -race -coverpkg=./... -coverprofile=build-results/coverage.out ./...
      - name: Coverage reports
        run: |
          python3 scripts/quality.py coverage
          go tool cover -html=build-results/coverage.out -o=build-results/coverage.html
      - run: make build
        env:
          CGO_ENABLED: "0"
      - name: Validate release license notices
        env:
          CGO_ENABLED: "0"
        run: python3 scripts/notices.py bin/kaferry bin/THIRD_PARTY_NOTICES.txt
      - name: Check documentation size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          readme = Path('README.md').read_text()
          paths = ['README.md', 'docs/usage.md', 'docs/file-format.md']
          total = sum(len(Path(path).read_text()) for path in paths)
          assert len(readme) <= 5500, f'README: {len(readme)} characters; limit 5,500'
          assert total < 10000, f'User docs: {total} characters; limit fewer than 10,000'
          print(f'README: {len(readme)}; combined user docs: {total} characters')
          PY
      - name: Publish Go coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build-results/coverage.out
          disable_search: true
          flags: go
          use_oidc: true
          version: v11.3.1
          fail_ci_if_error: true
      - if: always()
        run: python3 scripts/ci.py summary
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-fast
          path: build-results/
          retention-days: 30
  kafka:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      KAFKA_TEST_BROKERS: 127.0.0.1:39092
      KAFKA_TEST_DEST_BROKERS: 127.0.0.1:40092
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - run: python3 scripts/ci.py broker make broker
      - run: python3 scripts/ci.py integration go test -count=1 -json -race -tags=integration -coverpkg=./... -coverprofile=build-results/coverage.out ./...
      - name: Check progress and archives against the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .cache/previous-version
          git archive "$BASE_SHA" | tar -x -C .cache/previous-version
          previous_binary="$PWD/build-results/kaferry-previous"
          (cd .cache/previous-version && go build -trimpath -o "$previous_binary" ./cmd/kaferry)
          CGO_ENABLED=0 make build
          export KAFERRY_PREVIOUS_BINARY="$previous_binary"
          export KAFERRY_TEST_BINARY="$PWD/bin/kaferry"
          python3 scripts/ci.py migration go test -count=1 -race -tags=integration,migration -run TestPreviousBinary -v ./tests/compat
      - name: Capture bounded load measurements
        run: python3 scripts/ci.py load make load
      - name: Coverage reports
        run: |
          python3 scripts/quality.py coverage
          go tool cover -html=build-results/coverage.out -o=build-results/coverage.html
      - name: Publish Go coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build-results/coverage.out
          disable_search: true
          flags: go
          use_oidc: true
          version: v11.3.1
          fail_ci_if_error: true
      - if: always()
        run: |
          mkdir -p build-results
          docker compose -p kaferry-compat --profile cross-cluster logs --no-color > build-results/brokers.log
          make broker-down
      - if: always()
        run: python3 scripts/ci.py summary
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-kafka
          path: build-results/
          retention-days: 30
