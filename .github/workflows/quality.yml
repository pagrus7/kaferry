name: quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 8 * * 1'
permissions:
  contents: read
env:
  CGO_ENABLED: "0"
jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
        id: go
        with:
          cache-name: quality-go
      - name: Install pinned analyzers
        run: |
          mkdir -p .cache/quality-tools
          curl --fail --location --retry 3 https://github.com/golangci/golangci-lint/releases/download/v2.15.0/golangci-lint-2.15.0-linux-amd64.tar.gz -o .cache/quality-tools/golangci-lint.tar.gz
          echo '9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea  .cache/quality-tools/golangci-lint.tar.gz' | sha256sum --check
          tar -xzf .cache/quality-tools/golangci-lint.tar.gz -C .cache/quality-tools
          curl --fail --location --retry 3 https://github.com/kucherenko/jscpd/releases/download/v5.4.2/jscpd-linux-x64-gnu.tar.gz -o .cache/quality-tools/jscpd.tar.gz
          echo '216bae5de2b30c57f893286585c7a348e8af7cd36810949831f569d29f495a3b  .cache/quality-tools/jscpd.tar.gz' | sha256sum --check
          tar -xzf .cache/quality-tools/jscpd.tar.gz -C .cache/quality-tools
      - name: Script tests
        env:
          JSCPD: ${{ github.workspace }}/.cache/quality-tools/jscpd
          GOLANGCI_LINT: ${{ github.workspace }}/.cache/quality-tools/golangci-lint-2.15.0-linux-amd64/golangci-lint
        run: python3 -m unittest discover -s tools -t . -p 'test_*.py'
      - name: Go lint gate
        run: make lint GOLANGCI_LINT=.cache/quality-tools/golangci-lint-2.15.0-linux-amd64/golangci-lint
      - name: Duplication gate
        if: success() || failure()
        run: make duplicates JSCPD=.cache/quality-tools/jscpd DUPLICATION_BASE="${QUALITY_BASE_SHA:-HEAD}"
      - name: Maintainability reports
        if: success() || failure()
        run: python3 -m tools.ci.quality maintainability
      - name: Go vulnerability gate
        id: vulnerabilities
        if: success() || failure()
        run: make vulnerabilities
      - name: Upload Go findings
        if: (success() || failure()) && steps.vulnerabilities.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: build-results/govulncheck.sarif
          category: govulncheck-go
      - if: always()
        run: python3 -m tools.ci.ci summary
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-go
          path: build-results/
          retention-days: 30
      - uses: ./.github/actions/save-go
        with:
          key: ${{ steps.go.outputs.cache-key }}
          cache-hit: ${{ steps.go.outputs.cache-hit }}
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version: '1.27.3'
          cache: true
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}
      - if: matrix.language == 'go'
        run: make build
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: codeql-${{ matrix.language }}
  dependencies:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
