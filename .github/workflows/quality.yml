name: quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 8 * * 1'
permissions:
  contents: read
env:
  CGO_ENABLED: "0"
jobs:
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: true
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go, python, actions
      - run: make build
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          output: build-results/codeql
          upload: never
      - name: Preserve the per-language analysis categories
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          for language in ('go', 'python', 'actions'):
              path = Path('build-results/codeql') / (language+'.sarif')
              sarif = json.loads(path.read_text())
              for run in sarif['runs']:
                  run['automationDetails'] = {'id': 'codeql-'+language+'/'}
              path.write_text(json.dumps(sarif))
          PYTHON
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: build-results/codeql/go.sarif
          category: codeql-go
          matrix: '{"language":"go"}'
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: build-results/codeql/python.sarif
          category: codeql-python
          matrix: '{"language":"python"}'
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: build-results/codeql/actions.sarif
          category: codeql-actions
          matrix: '{"language":"actions"}'
