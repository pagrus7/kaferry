name: proxy probe coverage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/tests/replicated/portprobe/**'
      - 'src/tests/replicated/compose.yaml'
      - 'tools/__init__.py'
      - 'tools/qualification/__init__.py'
      - 'tools/qualification/network.py'
      - 'tools/qualification/proxy_port_reservation_images_test.py'
      - 'go.mod'
      - 'go.sum'
      - 'codecov.yml'
      - '.github/actions/setup-go/action.yml'
      - '.github/workflows/proxy-probe.yml'
  pull_request:
    paths:
      - 'src/tests/replicated/portprobe/**'
      - 'src/tests/replicated/compose.yaml'
      - 'tools/__init__.py'
      - 'tools/qualification/__init__.py'
      - 'tools/qualification/network.py'
      - 'tools/qualification/proxy_port_reservation_images_test.py'
      - 'go.mod'
      - 'go.sum'
      - 'codecov.yml'
      - '.github/actions/setup-go/action.yml'
      - '.github/workflows/proxy-probe.yml'
permissions: {}
concurrency:
  group: proxy-probe-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-go
        with:
          cache-name: proxy-probe
      - name: Check proxy listener reservations without brokers
        run: |
          python3 - <<'PY'
          import subprocess
          from tools.qualification.network import IMAGE
          subprocess.run(['docker', 'pull', IMAGE], check=True, timeout=180)
          PY
          python3 -m unittest -v tools.qualification.proxy_port_reservation_images_test
      - name: Publish proxy probe Go coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build-results/proxy-port-reservation/coverage.out
          disable_search: true
          flags: proxy-port-reservation
          use_oidc: true
          version: v11.3.1
          fail_ci_if_error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: proxy-port-reservation-coverage
          path: build-results/proxy-port-reservation
          if-no-files-found: error
          retention-days: 14
