name: integrity
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: integrity-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      run: ${{ steps.scope.outputs.run }}
      suites: ${{ steps.scope.outputs.suites }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: paths
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!README.md'
              - '!docs/**/*.md'
            grammar:
              - 'docs/design/grammar.md'
      - id: scope
        env:
          RUN: ${{ steps.paths.outputs.code == 'true' || steps.paths.outputs.grammar == 'true' }}
        run: |
          if [ "$RUN" = true ]; then
            suites='["fault-processes","fault-recovery","qualification"]'
            summary='fault-processes, fault-recovery, qualification'
          else
            suites='[]'
            summary='none (prose only)'
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
          echo "Suites: $summary" >> "$GITHUB_STEP_SUMMARY"
  suites:
    needs: select
    if: needs.select.outputs.run == 'true'
    uses: ./.github/workflows/suites.yml
    with:
      suites: ${{ needs.select.outputs.suites }}
      fault_tier: pr
  risk-check:
    needs: [select, suites]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          SELECT_RESULT: ${{ needs.select.result }}
          SUITE_RESULT: ${{ needs.suites.result }}
          RUN_SUITES: ${{ needs.select.outputs.run }}
        run: |
          test "$SELECT_RESULT" = success
          if [ "$RUN_SUITES" = true ]; then
            test "$SUITE_RESULT" = success
          else
            test "$RUN_SUITES" = false
            test "$SUITE_RESULT" = skipped
          fi
