name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the selected workflow tag (leave off for validation)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CGO_ENABLED: "0"
  RELEASE_TAG: ${{ (github.event_name == 'push' || inputs.publish) && github.ref_name || format('validation-{0}', github.sha) }}
jobs:
  build:
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-14
            platform: darwin-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate attested source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ "$PUBLISH" == true ]]; then
            test "$REF_TYPE" = tag
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            python3 scripts/release_notes.py "$RELEASE_TAG" > /dev/null
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - run: make check
      - name: Build versioned binary
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          make build KAFERRY_VERSION="$RELEASE_TAG" KAFERRY_REVISION="$SOURCE_SHA"
          version=$(bin/kaferry --version)
          echo "$version"
          [[ "$version" == "kaferry $RELEASE_TAG (commit $SOURCE_SHA; "* ]]
      - name: Build information and platform requirements
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p release
          go version -m bin/kaferry > "release/build-$PLATFORM.txt"
          if [[ "$PLATFORM" == linux-* ]]; then
            python3 - <<'PY'
          import subprocess
          program_headers = subprocess.check_output(['readelf', '--program-headers', '--wide', 'bin/kaferry'], text=True)
          assert 'INTERP' not in program_headers, 'Linux binary unexpectedly needs a dynamic linker'
          print('Static Linux binary: no dynamic interpreter')
          PY
          else
            otool -l bin/kaferry | grep -A5 LC_BUILD_VERSION
          fi
      - name: Binary SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: bin/kaferry
          format: spdx-json
          output-file: release/sbom-${{ matrix.platform }}.spdx.json
          syft-version: v1.55.0
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Package licenses and binary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 scripts/notices.py bin/kaferry bin/THIRD_PARTY_NOTICES.txt
          COPYFILE_DISABLE=1 tar -czf "release/kaferry-$RELEASE_TAG-$PLATFORM.tar.gz" -C bin kaferry THIRD_PARTY_NOTICES.txt -C "$GITHUB_WORKSPACE" LICENSE
      - name: Test the packaged binary
        env:
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p .cache/release-smoke
          tar -xzf "release/kaferry-$RELEASE_TAG-$PLATFORM.tar.gz" -C .cache/release-smoke
          test -s .cache/release-smoke/LICENSE
          test -s .cache/release-smoke/THIRD_PARTY_NOTICES.txt
          version=$(.cache/release-smoke/kaferry --version)
          [[ "$version" == "kaferry $RELEASE_TAG (commit $SOURCE_SHA; "* ]]
          go run ./scripts/package_examples .cache/release-smoke/archive-demo.tar.gz
          set -o pipefail
          KAFERRY_TUTORIAL_BUNDLE="$PWD/.cache/release-smoke/archive-demo.tar.gz" KAFERRY_TEST_BINARY="$PWD/.cache/release-smoke/kaferry" KAFERRY_EXPECT_BINARY_SHA256="$(shasum -a 256 .cache/release-smoke/kaferry | cut -d ' ' -f 1)" go test -count=1 -json -tags=integration,load -run '^(TestArchiveTutorial|TestLoadObservability)$/^round-0$/^disabled$' ./tests/compat | tee ".cache/release-smoke/smoke-$PLATFORM.log"
          KAFERRY_REPORT_DIR=.cache/release-smoke python3 scripts/ci.py verify-tests "smoke-$PLATFORM" 'TestLoadObservability/round-0/disabled' 'TestArchiveTutorial'
          if [ "$PLATFORM" = linux-amd64 ]; then
            cp .cache/release-smoke/archive-demo.tar.gz release/archive-demo.tar.gz
          fi
      - name: Attest archive provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tar.gz
      - name: Attest binary SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bin/kaferry
          sbom-path: release/sbom-${{ matrix.platform }}.spdx.json
      - name: Save attestation bundles
        env:
          PLATFORM: ${{ matrix.platform }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE" "release/provenance-$PLATFORM.json"
          cp "$SBOM" "release/sbom-attestation-$PLATFORM.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: release/
          retention-days: 30
  linux-validation:
    needs: build
    uses: ./.github/workflows/suites.yml
    with:
      suites: '["integration","load","fault","qualification","soak"]'
      artifact: release-linux-amd64
  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: [build, linux-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate source and release notes
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          python3 scripts/release_notes.py "$RELEASE_TAG" > release-notes.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: qualification-*
          path: .cache/release-evidence/
      - name: Retain release qualification results
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/ci.py release-summary .cache/release-evidence "release/kaferry-$RELEASE_TAG-linux-amd64.tar.gz" "$SOURCE_SHA" "$RELEASE_TAG" release/qualification.md
      - name: Checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          files = sorted(p for p in Path('release').iterdir() if p.is_file())
          Path('release/SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "Kaferry $RELEASE_TAG" --notes-file release-notes.txt release/*

  containers:
    if: github.event_name == 'push' || inputs.publish
    needs: publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/containers.yml
    with:
      tag: ${{ github.ref_name }}
      publish: true
