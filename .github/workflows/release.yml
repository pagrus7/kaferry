name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the selected workflow tag (leave off for validation)'
        type: boolean
        default: false
        required: true
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ (github.event_name == 'push' || inputs.publish) && github.ref_name || format('validation-{0}', github.sha) }}
jobs:
  build:
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate attested source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ "$PUBLISH" == true ]]; then
            test "$REF_TYPE" = tag
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            python3 scripts/release_notes.py "$RELEASE_TAG" > /dev/null
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: true
      - run: make check build
      - name: Package binary and build information
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p release
          COPYFILE_DISABLE=1 tar -czf "release/kaferry-$RELEASE_TAG-$PLATFORM.tar.gz" -C bin kaferry
          go version -m bin/kaferry > "release/build-$PLATFORM.txt"
          if [[ "$PLATFORM" == linux-* ]]; then
            python3 - <<'PY'
          import re
          import subprocess
          symbols = subprocess.check_output(['readelf', '--dyn-syms', '--wide', 'bin/kaferry'], text=True)
          versions = [tuple(map(int, v.split('.'))) for v in re.findall(r'GLIBC_([0-9.]+)', symbols)]
          assert versions, 'Expected dynamically linked glibc binary'
          required = max(versions)
          assert required <= (2, 34), f'Binary requires glibc {required}; README promises 2.34+'
          print('Minimum glibc: ' + '.'.join(map(str, required)))
          PY
          else
            otool -l bin/kaferry | grep -A5 LC_BUILD_VERSION
          fi
      - name: Binary SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: bin/kaferry
          format: spdx-json
          output-file: release/sbom-${{ matrix.platform }}.spdx.json
          syft-version: v1.54.1
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Native inventory
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/native_inventory.py bin/kaferry "release/sbom-$PLATFORM.spdx.json" "release/native-$PLATFORM.json"
      - name: Attest archive provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tar.gz
      - name: Attest binary SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: bin/kaferry
          sbom-path: release/sbom-${{ matrix.platform }}.spdx.json
      - name: Save attestation bundles
        env:
          PLATFORM: ${{ matrix.platform }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE" "release/provenance-$PLATFORM.json"
          cp "$SBOM" "release/sbom-attestation-$PLATFORM.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: release/
          retention-days: 30
  publish:
    if: github.event_name == 'push' || inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate source and release notes
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          python3 scripts/release_notes.py "$RELEASE_TAG" > release-notes.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release/
      - name: Checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          files = sorted(p for p in Path('release').iterdir() if p.is_file())
          Path('release/SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "Kaferry $RELEASE_TAG" --notes-file release-notes.txt release/*
