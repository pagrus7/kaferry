name: compatibility
on:
  pull_request:
  schedule:
    - cron: '43 11 * * 0,2-6'
    - cron: '43 11 * * 1'
  workflow_dispatch:
    inputs:
      tier:
        description: 'pr = oldest/newest; nightly = same-version; full = every directed pair'
        type: choice
        options: [pr, nightly, full]
        default: full
  workflow_call:
    inputs:
      artifact:
        description: 'Exact Linux AMD64 release archive to qualify'
        type: string
        default: ''
      tier:
        type: string
        default: full
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      tier: ${{ steps.matrix.outputs.tier }}
      run: ${{ steps.scope.outputs.relevant == 'false' && 'false' || steps.schedule.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select PR compatibility scope
        id: scope
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            relevant:
              - '**'
              - '!README.md'
              - '!CONTRIBUTING.md'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!docs/**/*.md'
              - '!.claude/agents/**/*.md'
              - '!.claude/skills/**/SKILL.md'
              - '!.codex/agents/**/*.toml'
              - '!src/cmd/**/*_test.go'
              - '!src/internal/**/*_test.go'
              - '!src/tests/system/**/*_test.go'
              - '!tools/**/test_*.py'
      - id: matrix
        env:
          TIER: ${{ inputs.tier || (github.event_name == 'pull_request' && 'pr') || (github.event.schedule == '43 11 * * 1' && 'full') || 'nightly' }}
        run: |
          echo "matrix=$(python3 -m tools.qualification.qualify plan --tier "$TIER")" >> "$GITHUB_OUTPUT"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
      - name: Choose matrix or reuse recent executions
        id: schedule
        if: steps.scope.outputs.relevant != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORCE_RUN: ${{ inputs.artifact != '' }}
          TIER: ${{ steps.matrix.outputs.tier }}
        run: python3 -m tools.ci.scheduled compatibility --tier "$TIER"
  cases:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
        with:
          cache-name: pr-brokers
      - name: Install independent checker
        if: matrix.suite == 'broker'
        run: python3 -m tools.qualification.qualify setup
      - name: Build candidate
        if: inputs.artifact == ''
        run: make build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
          path: .cache/release-input
      - name: Extract the exact release executable
        if: inputs.artifact != ''
        run: |
          mkdir -p bin
          set -- .cache/release-input/kaferry-*-linux-amd64.tar.gz
          test "$#" = 1
          tar -xzf "$1" -C bin kaferry
      - name: Run standalone suite
        env:
          SUITE: ${{ matrix.suite }}
          SOURCE: ${{ matrix.source }}
          DESTINATION: ${{ matrix.destination }}
          CASE_ID: ${{ matrix.id }}
          DURATION: ${{ matrix.duration }}
        run: |
          set -- "$SUITE" --source "$SOURCE" --destination "$DESTINATION" --output "build-results/$CASE_ID"
          if [ -n "$DURATION" ]; then set -- "$@" --duration "${DURATION}s"; fi
          python3 -m tools.qualification.qualify run "$@"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: matrix-${{ matrix.id }}
          path: build-results/
          retention-days: 14
  report:
    name: report (${{ needs.plan.outputs.tier }})
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.run == 'true'
    needs: [plan, cases]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: matrix-*
          merge-multiple: true
          path: build-results/
      - name: Require complete matching evidence
        env:
          TIER: ${{ needs.plan.outputs.tier }}
        run: python3 -m tools.qualification.qualify report build-results --tier "$TIER"
      - name: Show matrix
        if: always()
        run: cat build-results/qualification.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compatibility-matrix
          path: build-results/qualification.*
          retention-days: 30
