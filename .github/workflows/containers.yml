name: containers
on:
  pull_request:
    paths:
      - '.github/workflows/containers.yml'
      - '.github/workflows/release.yml'
      - 'README.md'
      - 'docs/usage.md'
      - 'tools/release/**'
      - 'src/tests/system/container_test.go'
      - 'examples/archive-demo/**'
      - 'src/cmd/package-examples/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published stable release tag'
        type: string
        required: true
      publish:
        description: 'Publish the tested images to GHCR'
        type: boolean
        default: false
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      publish:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: containers-${{ github.event.pull_request.number || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      revision: ${{ steps.inputs.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/container-build
        id: inputs
        with:
          tag: ${{ inputs.tag }}
          candidate: ${{ github.event_name == 'pull_request' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-inputs
          path: |
            .cache/kaferry.oci.tar
            .cache/kaferry-demo.oci.tar
            .cache/container-context/
          include-hidden-files: true
          retention-days: 7
  test:
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-inputs
          path: .cache
      - uses: ./.github/actions/container-test
        with:
          arch: ${{ matrix.arch }}
  publish:
    if: github.event_name != 'pull_request' && inputs.publish
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: kaferry-container-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-inputs
          path: .cache
      - run: sudo apt-get update && sudo apt-get install --yes skopeo
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - id: push
        name: Publish the tested OCI archive without replacing a version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          digest=$(python3 -m tools.release.container_publish .cache/kaferry.oci.tar "ghcr.io/pagrus7/kaferry:$VERSION")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          demo_digest=$(python3 -m tools.release.container_publish .cache/kaferry-demo.oci.tar "ghcr.io/pagrus7/kaferry-demo:$VERSION")
          echo "demo_digest=$demo_digest" >> "$GITHUB_OUTPUT"
      - name: Attest the published image index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/pagrus7/kaferry
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest the published demo image index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/pagrus7/kaferry-demo
          subject-digest: ${{ steps.push.outputs.demo_digest }}
          push-to-registry: true
      - name: Update the latest stable image alias
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          current=$(gh api repos/pagrus7/kaferry/releases/latest --jq .tag_name)
          if [ "$VERSION" = "$current" ]; then
            python3 -m tools.release.container_publish .cache/kaferry.oci.tar ghcr.io/pagrus7/kaferry:latest
            python3 -m tools.release.container_publish .cache/kaferry-demo.oci.tar ghcr.io/pagrus7/kaferry-demo:latest
          fi
