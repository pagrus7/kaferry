x-broker: &broker
  image: apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02
  extra_hosts: ["host.docker.internal:host-gateway"]
  healthcheck:
    test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
    interval: 2s
    timeout: 3s
    retries: 30
x-environment: &environment
  CLUSTER_ID: yW4mRslzR06Z6eKEpLhU8A
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,CLIENT://:9094
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,CLIENT:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@marker-1:9093,2@marker-2:9093,3@marker-3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
services:
  marker-1:
    <<: *broker
    ports: ["127.0.0.1:45092:9094", "127.0.0.1:48111:9092"]
    environment:
      <<: *environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://host.docker.internal:48101,CLIENT://127.0.0.1:45092
  marker-2:
    <<: *broker
    ports: ["127.0.0.1:46092:9094", "127.0.0.1:48112:9092"]
    environment:
      <<: *environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://host.docker.internal:48102,CLIENT://127.0.0.1:46092
  marker-3:
    <<: *broker
    ports: ["127.0.0.1:47092:9094", "127.0.0.1:48113:9092"]
    environment:
      <<: *environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://host.docker.internal:48103,CLIENT://127.0.0.1:47092
