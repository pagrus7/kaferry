x-broker: &broker
  image: ${KAFERRY_AUTH_IMAGE:-apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02}
  volumes:
    - ${KAFERRY_QUAL_CERT_DIR:?generate fixture certificates}:/mnt/certs:ro
  depends_on:
    kdc:
      condition: service_healthy
  healthcheck:
    test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, "localhost:9092", --list]
    interval: 5s
    timeout: 5s
    retries: 18

x-environment: &environment
  CLUSTER_ID: rbAmUsKVRT2GTarCaxVk5w
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_HEAP_OPTS: -Xms128m -Xmx512m
  KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 4
  KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 4
  KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,SECURE://:9095,MTLS://:9096,TLS://:9097
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,SECURE:SASL_SSL,MTLS:SSL,TLS:SSL
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-secure-1:9093,2@kafka-secure-2:9093,3@kafka-secure-3:9093
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
  KAFKA_SUPER_USERS: User:admin;User:ANONYMOUS
  KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
  KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512,OAUTHBEARER,GSSAPI
  KAFKA_OPTS: -Djava.security.krb5.conf=/mnt/certs/broker-krb5.conf -Dorg.apache.kafka.sasl.oauthbearer.allowed.urls=http://kdc:8080/keys.json
  KAFKA_SASL_KERBEROS_SERVICE_NAME: kafka
  KAFKA_LISTENER_NAME_SECURE_GSSAPI_SASL_JAAS_CONFIG: >-
    com.sun.security.auth.module.Krb5LoginModule required useKeyTab=true storeKey=true
    keyTab="/mnt/certs/broker.keytab" principal="kafka/127.0.0.1@KAFERRY.TEST" isInitiator=false;
  KAFKA_LISTENER_NAME_SECURE_OAUTHBEARER_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required
    unsecuredLoginStringClaim_sub="admin";
  KAFKA_LISTENER_NAME_SECURE_OAUTHBEARER_SASL_SERVER_CALLBACK_HANDLER_CLASS: ${KAFERRY_OAUTH_VALIDATOR:-org.apache.kafka.common.security.oauthbearer.secured.OAuthBearerValidatorCallbackHandler}
  KAFKA_LISTENER_NAME_SECURE_OAUTHBEARER_SASL_OAUTHBEARER_JWKS_ENDPOINT_URL: http://kdc:8080/keys.json
  KAFKA_LISTENER_NAME_SECURE_OAUTHBEARER_SASL_OAUTHBEARER_EXPECTED_ISSUER: https://kaferry.test
  KAFKA_LISTENER_NAME_SECURE_OAUTHBEARER_SASL_OAUTHBEARER_EXPECTED_AUDIENCE: kaferry-qualification
  KAFKA_LISTENER_NAME_SECURE_OAUTHBEARER_SASL_OAUTHBEARER_CLOCK_SKEW_SECONDS: 0
  KAFKA_LISTENER_NAME_SECURE_OAUTHBEARER_SASL_OAUTHBEARER_JWKS_ENDPOINT_REFRESH_MS: 1000
  KAFKA_CONNECTIONS_MAX_REAUTH_MS: 5000
  KAFKA_LISTENER_NAME_MTLS_SSL_CLIENT_AUTH: required
  KAFKA_SSL_PRINCIPAL_MAPPING_RULES: RULE:^CN=(.*)$$/$$1/,DEFAULT
  KAFKA_LISTENER_NAME_SECURE_SCRAM___SHA___256_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.scram.ScramLoginModule required;
  KAFKA_LISTENER_NAME_SECURE_SCRAM___SHA___512_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.scram.ScramLoginModule required;
  KAFKA_LISTENER_NAME_SECURE_PLAIN_SASL_JAAS_CONFIG: >-
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin" password="fixture-admin-secret"
    user_admin="fixture-admin-secret" user_copier="fixture-copy-secret"
    user_denied="fixture-denied-secret";
  KAFKA_SSL_KEYSTORE_LOCATION: /mnt/certs/broker.p12
  KAFKA_SSL_KEYSTORE_TYPE: PKCS12
  KAFKA_SSL_KEYSTORE_PASSWORD: fixture-keystore-secret
  KAFKA_SSL_KEY_PASSWORD: fixture-keystore-secret
  KAFKA_SSL_TRUSTSTORE_TYPE: PEM
  KAFKA_SSL_TRUSTSTORE_LOCATION: /mnt/certs/ca.pem
  KAFKA_SSL_CLIENT_AUTH: none

services:
  kdc:
    build: kerberos
    ports: ["127.0.0.1:44088:88"]
    volumes:
      - ${KAFERRY_QUAL_CERT_DIR:?generate fixture certificates}:/mnt/certs
    healthcheck:
      test: [CMD, sh, -c, "test -s /mnt/certs/copier.keytab && kadmin.local -q 'getprinc copier@KAFERRY.TEST'"]
      interval: 2s
      timeout: 5s
      retries: 15
  kafka-secure-1:
    <<: *broker
    ports: ["127.0.0.1:41092:9095", "127.0.0.1:41093:9096", "127.0.0.1:41094:9097"]
    environment:
      <<: *environment
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-secure-1:9092,SECURE://127.0.0.1:41092,MTLS://127.0.0.1:41093,TLS://127.0.0.1:41094
  kafka-secure-2:
    <<: *broker
    ports: ["127.0.0.1:42092:9095", "127.0.0.1:42093:9096", "127.0.0.1:42094:9097"]
    environment:
      <<: *environment
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-secure-2:9092,SECURE://127.0.0.1:42092,MTLS://127.0.0.1:42093,TLS://127.0.0.1:42094
  kafka-secure-3:
    <<: *broker
    ports: ["127.0.0.1:43092:9095", "127.0.0.1:43093:9096", "127.0.0.1:43094:9097"]
    environment:
      <<: *environment
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-secure-3:9092,SECURE://127.0.0.1:43092,MTLS://127.0.0.1:43093,TLS://127.0.0.1:43094
