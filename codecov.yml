codecov:
  notify:
    after_n_builds: 3
flags:
  proxy-port-reservation:
    paths:
      - src/tests/replicated/portprobe/
    carryforward: true
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
    patch:
      default:
        target: 80%
comment:
  layout: 'diff, files'
  behavior: default
  require_changes: true
